<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="white" fill-opacity="0.75">
    <!-- Move the origin to the center (20, 20) then rotate the cross 45° -->
    <g transform="translate(10, 10) rotate(45)">
        <!-- Vertical bar -->
        <rect x="-1" y="-10" width="2" height="20"/>
        <!-- Horizontal bar -->
        <rect x="-10" y="-1" width="20" height="2"/>
    </g>
</svg>
